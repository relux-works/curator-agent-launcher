name: CI

on:
  push:
    # gate/** carries the throwaway snapshots scripts/remote-gate.sh pushes
    # for the task-board landing gate; the branch is deleted after the run.
    branches: [main, 'gate/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Minimal Go gate for a small CLI: build, gofmt, vet, tests with goldens,
# and the race detector, on the two runners the launcher targets, plus a
# release-binary reproducibility check. No release, tag, or publish step
# lives here.
jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: gofmt check
        run: make fmt-check

      - name: go build
        run: make build

      - name: go vet
        run: make vet

      - name: go test
        run: make test

      - name: Release admission controls
        run: make release-gate-test

  race:
    name: Race (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: go test -race
        run: make race

  # Builds `make release-binary` in two checkout directories and requires
  # identical bytes (FRONT-DOOR §10). It publishes nothing.
  release-repro:
    name: Release reproducibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: make release-repro
        run: make release-repro

  # Enable only after a matching runner is registered for this repository.
  test-self-hosted:
    name: Test (rose-air)
    if: ${{ vars.ROSE_AIR_RUNNER == 'true' }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Build, lint, test, race and goldens
        run: make check
