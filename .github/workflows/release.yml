name: Release

on:
  push:
    tags: ['v*']

# Each job grants only its own authority; admission cannot publish or use OIDC.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  admission:
    permissions:
      contents: read
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify signed release tag and pinned version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/release-gate.sh "$RELEASE_TAG"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Check release version documentation and help
        run: go test ./cmd/curator-run -run '^TestReleaseVersionPinned$' -count=1

  publish:
    needs: admission
    permissions:
      contents: write
      id-token: write
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Recheck the fetched tag in case its ref changed after admission.
      - name: Recheck admitted tag in the publish checkout
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/release-gate.sh "$RELEASE_TAG"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      # GoReleaser's before hook rejects partial signing configuration before
      # any release build. Only this pinned consumer receives the five fields.
      - name: Build, sign, notarize and publish
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
