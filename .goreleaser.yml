version: 2

project_name: curator-run

builds:
  - id: curator-run
    main: ./cmd/curator-run
    binary: curator-run
    # Pin the toolchain from go.mod even outside Actions. These settings must
    # produce the same unsigned bytes as make release-binary.
    tool: ./scripts/release-go.sh
    env: [CGO_ENABLED=0, GOFLAGS=-mod=readonly]
    goos: [darwin, linux]
    goarch: [arm64, amd64]
    flags: [-trimpath, -buildvcs=false]
    ldflags:
      - -s -w -buildid= -X main.buildVersion={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files: [LICENSE, NOTICE, README.md]

# Generate the formula locally; the tap and repository are not chosen yet.
# GoReleaser requires repository metadata to run the generator at all. Reuse
# the source repository for that metadata only; skip_upload forbids writes.
# This is not a tap selection and requires no tap credentials.
brews:
  - name: curator-run
    ids: [default]
    skip_upload: true
    repository:
      owner: relux-works
      name: curator-agent-launcher
    directory: Formula
    homepage: https://github.com/relux-works/curator-agent-launcher
    description: Interactive agent launcher for Curator
    license: Apache-2.0
    install: |
      bin.install "curator-run"
    test: |
      assert_match version.to_s, shell_output("#{bin}/curator-run --version")

# nFPM wraps only the Linux builds, without rebuilding or stripping them.
# Packages are release assets; there is no apt/yum repository publisher.
nfpms:
  - id: packages
    ids: [curator-run]
    package_name: curator-run
    vendor: Relux Works, LLC
    homepage: https://github.com/relux-works/curator-agent-launcher
    maintainer: Ivan Oparin <ivan@relux.works>
    description: Interactive agent launcher for Curator
    license: Apache-2.0
    formats: [deb, rpm]
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/curator-run/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/curator-run/NOTICE

checksum:
  name_template: checksums.txt

# Same opt-in and five org secrets as Curator. GoReleaser applies this only
# to Darwin binaries, after building and before archiving/checksumming.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [curator-run]
      sign:
        certificate: '{{ .Env.MACOS_SIGN_P12 }}'
        password: '{{ .Env.MACOS_SIGN_P12_PASSWORD }}'
      notarize:
        issuer_id: '{{ .Env.ASC_ISSUER_ID }}'
        key_id: '{{ .Env.ASC_KEY_ID }}'
        key: '{{ .Env.ASC_KEY_P8 }}'
        wait: true
        timeout: 20m

# Mirror Curator: keyless cosign signs only the final checksums file.
signs:
  - cmd: cosign
    certificate: '${artifact}.pem'
    args:
      - sign-blob
      - '--output-certificate=${certificate}'
      - '--output-signature=${signature}'
      - '${artifact}'
      - --yes
    artifacts: checksum
    output: true

release:
  github:
    owner: relux-works
    name: curator-agent-launcher
  draft: false
  prerelease: auto

changelog:
  use: github
